---
# Phase 5: Post-hardening operational verification

- name: Verify system is still operational (not checking compliance)
  when: rhel_cis_apply_remediations | default(true)
  block:
    - name: Run comprehensive operational check
      ansible.builtin.include_tasks: verify_operational.yml

    - name: Display operational verdict
      ansible.builtin.debug:
        msg: |
          =========================================================================
          {% if rhel_cis_system_is_operable | default(false) %}
          ✅ SYSTEM IS OPERATIONAL

          The system is functional and accessible.
          Any remaining CIS findings are NON-CRITICAL and can be:
            - Addressed manually
            - Documented as exceptions
            - Fixed in a future remediation run

          No rollback needed - hardening will continue.
          {% else %}
          ❌ SYSTEM IS INOPERABLE

          Critical failures detected:
          {% for failure in rhel_cis_operational_failures | default(['Unknown operational failure']) %}
            - {{ failure }}
          {% endfor %}

          Rollback will be initiated to restore functionality.
          {% endif %}
          =========================================================================

    - name: Decide if rollback is needed based on operability
      when: not (rhel_cis_system_is_operable | default(true)) and (rhel_cis_auto_rollback_on_failure | default(false))
      block:
        - name: Set failure details for inoperable system
          ansible.builtin.set_fact:
            rhel_cis_failure_reason: "System is inoperable after CIS hardening"
            rhel_cis_failure_details: "Critical failures: {{ rhel_cis_operational_failures | default([]) | join(', ') }}"
            rhel_cis_failure_log_location: >-
              {{ rhel_cis_work_dir }}/remediation_{{ rhel_cis_backup_timestamp }}.log
            rhel_cis_failure_type: "system_inoperable"

        - name: Display rollback warning
          ansible.builtin.debug:
            msg: "⚠️  System is inoperable, initiating rollback..."

        - name: Execute emergency rollback
          ansible.builtin.include_tasks: rollback.yml
          vars:
            rollback_reason: "{{ rhel_cis_failure_reason }}"
            rollback_details: "{{ rhel_cis_failure_details }}"

- name: Run post-hardening audit
  ansible.builtin.command: >
    oscap xccdf eval
    --profile {{ rhel_cis_profile_id }}
    --results "{{ rhel_cis_audit_dir }}/post_hardening_{{ rhel_cis_backup_timestamp }}.xml"
    --results-arf "{{ rhel_cis_audit_dir }}/post_hardening_{{ rhel_cis_backup_timestamp }}-arf.xml"
    --report "{{ rhel_cis_audit_dir }}/post_hardening_{{ rhel_cis_backup_timestamp }}.html"
    "{{ rhel_cis_scap_ds_path }}"
  register: rhel_cis_post_scan
  failed_when: false
  changed_when: false
  when: rhel_cis_apply_remediations | default(true)

- name: Check if post-hardening audit XML exists
  ansible.builtin.stat:
    path: "{{ rhel_cis_audit_dir }}/post_hardening_{{ rhel_cis_backup_timestamp }}.xml"
  register: rhel_cis_post_xml_stat
  when: rhel_cis_apply_remediations | default(true)

- name: Parse post-hardening audit results (native)
  when:
    - rhel_cis_apply_remediations | default(true)
    - rhel_cis_post_xml_stat.stat.exists | default(false)
    - rhel_cis_use_native_parsing | default(true)
  block:
    - name: Parse OSCAP score for post-hardening
      ansible.builtin.include_tasks: parse_oscap_score.yml
      vars:
        oscap_xml_file: "{{ rhel_cis_audit_dir }}/post_hardening_{{ rhel_cis_backup_timestamp }}.xml"

    - name: Set post score variables
      ansible.builtin.set_fact:
        rhel_cis_post_score:
          stdout: "{{ rhel_cis_oscap_compliance_score }}"
        rhel_cis_post_score_val: "{{ rhel_cis_oscap_compliance_score }}"

- name: Set default post-hardening score if not already populated
  ansible.builtin.set_fact:
    rhel_cis_post_score:
      stdout: '0.0'
    rhel_cis_post_score_val: '0.0'
  when: rhel_cis_post_score_val is not defined
