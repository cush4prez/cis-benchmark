---
- name: Apply RHEL CIS Benchmark Hardening with Rollback Protection
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Convert survey inputs to role variables (AAP)
      ansible.builtin.set_fact:
        rhel_cis_rules_to_apply: >-
          {% if (cis_audit_mode | default(stig_audit_mode | default('full'))) == 'selective' and (stig_rules_input is defined) %}
          {{ stig_rules_input.split(',') | map('trim') | select | list }}
          {% else %}
          []
          {% endif %}
      when: cis_audit_mode is defined or stig_audit_mode is defined

  roles:
    - role: rhel_cis
