---
# CIS Benchmark Hardening with Rollback - Default Variables

# CIS Benchmark profile configuration
# Options:
#   - cis_server_l1: CIS Red Hat Enterprise Linux Benchmark Level 1 - Server (default)
#   - cis_server_l2: CIS Red Hat Enterprise Linux Benchmark Level 2 - Server
#   - cis_workstation_l1: CIS Red Hat Enterprise Linux Benchmark Level 1 - Workstation
#   - cis_workstation_l2: CIS Red Hat Enterprise Linux Benchmark Level 2 - Workstation
#   - custom: Use rhel_cis_profile_id directly
rhel_cis_benchmark_profile: "cis_server_l1"

# Profile ID mapping
rhel_cis_profile_map:
  cis: "xccdf_org.ssgproject.content_profile_cis"
  cis_server_l1: "xccdf_org.ssgproject.content_profile_cis_server_l1"
  cis_server_l2: "xccdf_org.ssgproject.content_profile_cis_server_l2"
  cis_workstation_l1: "xccdf_org.ssgproject.content_profile_cis_workstation_l1"
  cis_workstation_l2: "xccdf_org.ssgproject.content_profile_cis_workstation_l2"

# Evaluated SCAP Profile ID
rhel_cis_profile_id: "{{ rhel_cis_profile_map[rhel_cis_benchmark_profile] | default(rhel_cis_profile_map['cis_server_l1']) }}"

# Datastream location
rhel_cis_scap_ds_path: "/usr/share/xml/scap/ssg/content/ssg-rhel{{ ansible_facts['distribution_major_version'] }}-ds.xml"

# Tailoring configuration
rhel_cis_tailoring_profile: ""

# Native Ansible XML parsing
rhel_cis_use_native_parsing: true
rhel_cis_auto_detect_python: true
rhel_cis_auto_install_deps: true

# Backup configuration
rhel_cis_enable_auto_backup: true
rhel_cis_backup_root: "/opt/cis_backups"
rhel_cis_backup_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
rhel_cis_backup_name: "pre_cis_{{ ansible_hostname }}_{{ rhel_cis_backup_timestamp }}"
rhel_cis_fetch_to_controller: false
rhel_cis_controller_backup_dir: "/var/lib/awx/projects/cis_backups"

# Working directories
rhel_cis_audit_dir: "/opt/cis_audit"
rhel_cis_work_dir: "/opt/cis_work"

# Remediation control
rhel_cis_apply_remediations: true
rhel_cis_rules_to_apply: []
rhel_cis_selective_mode: false

# Rollback configuration
rhel_cis_auto_rollback_on_failure: true
rhel_cis_rollback_on_critical_service_failure: true
rhel_cis_critical_services:
  - sshd
  - NetworkManager
